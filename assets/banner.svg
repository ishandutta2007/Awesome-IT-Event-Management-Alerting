<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes pulseAlert {
        0%, 100% { fill: #ef4444; filter: drop-shadow(0 0 3px #ef4444); }
        50% { fill: #f97316; filter: drop-shadow(0 0 10px #f97316); }
      }
      @keyframes pulseHealthy {
        0%, 100% { fill: #10b981; filter: drop-shadow(0 0 3px #10b981); }
        50% { fill: #34d399; filter: drop-shadow(0 0 10px #34d399); }
      }
      @keyframes dashStream {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }
      .anim-glow1 {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .anim-glow2 {
        animation: pulseGlow 8s ease-in-out infinite reverse;
        transform-origin: 1000px 320px;
      }
      .anim-alert-dot {
        animation: pulseAlert 2s infinite ease-in-out;
      }
      .anim-healthy-dot {
        animation: pulseHealthy 2.5s infinite ease-in-out;
      }
      .anim-stream {
        stroke-dasharray: 8 6;
        animation: dashStream 3s linear infinite;
      }
      .anim-card-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .anim-card-2 {
        animation: floatReverse 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep Tech Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Animated Ambient Nebula Lights in Background -->
  <circle cx="180" cy="90" r="140" fill="#38bdf8" opacity="0.2" filter="url(#softGlow)" class="anim-glow1" />
  <circle cx="1020" cy="310" r="160" fill="#818cf8" opacity="0.2" filter="url(#softGlow)" class="anim-glow2" />
  <circle cx="600" cy="210" r="180" fill="#c084fc" opacity="0.12" filter="url(#softGlow)" />

  <!-- Dynamic Event Flow Visualizer Behind / Around Center Elements -->
  <!-- Pipeline flow: Ingestion -> Deduplication / AIOps Correlation -> Automated Routing -->
  <g opacity="0.75">
    <!-- Stream Line 1 (Raw Events to Correlation Engine) -->
    <path d="M 120 330 C 260 330, 240 270, 380 270" fill="none" stroke="#60a5fa" stroke-width="2.5" class="anim-stream" opacity="0.6" />
    <!-- Stream Line 2 (Noise Reduction to Incident Escalation) -->
    <path d="M 820 270 C 940 270, 960 330, 1080 330" fill="none" stroke="#a855f7" stroke-width="2.5" class="anim-stream" opacity="0.6" />
  </g>

  <!-- Left Dynamic Card: Live Stream / Ingestion Status -->
  <g class="anim-card-1" transform="translate(60, 230)">
    <rect width="260" height="130" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" />
    <circle cx="28" cy="28" r="6" class="anim-alert-dot" />
    <text x="44" y="33" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Event Ingest Storm</text>
    <text x="22" y="62" fill="#9ca3af" font-family="monospace" font-size="11">Events: 24,500/sec</text>
    <text x="22" y="84" fill="#9ca3af" font-family="monospace" font-size="11">Noise Deduplicated: 98.4%</text>
    <rect x="22" y="100" width="130" height="16" rx="4" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="0.8" />
    <text x="28" y="112" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold">HIGH ALERT DEDUP</text>
  </g>

  <!-- Right Dynamic Card: AIOps Root Cause & Escalation -->
  <g class="anim-card-2" transform="translate(880, 230)">
    <rect width="260" height="130" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" />
    <circle cx="28" cy="28" r="6" class="anim-healthy-dot" />
    <text x="44" y="33" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Correlated Root Cause</text>
    <text x="22" y="62" fill="#9ca3af" font-family="monospace" font-size="11">Active Incidents: 1 (Was 64)</text>
    <text x="22" y="84" fill="#9ca3af" font-family="monospace" font-size="11">Escalated: PagerDuty / NOC</text>
    <rect x="22" y="100" width="135" height="16" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="0.8" />
    <text x="28" y="112" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold">AIOps RCA RESOLVED</text>
  </g>

  <!-- Center Decorative Engine Node Indicator -->
  <g transform="translate(600, 290)">
    <circle cx="0" cy="0" r="32" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#glow)" />
    <circle cx="0" cy="0" r="12" fill="#6366f1" class="anim-healthy-dot" />
    <!-- Dynamic Rings -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#4f46e5" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />
  </g>

  <!-- FOREGROUND HERO HEADER & TEXT (Never obscured, maximum contrast and hierarchy) -->
  <g id="foreground-content">
    <!-- Top Pill / Badge -->
    <g transform="translate(600, 48)">
      <rect x="-165" y="0" width="330" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.95" />
      <text x="0" y="18" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">⚡ CURATED AIOPS &amp; ALERTING DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="115" text-anchor="middle" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">Awesome IT Event Management &amp; Alerting</text>

    <!-- Subtitle -->
    <text x="600" y="152" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" letter-spacing="0.2">AIOps Event Correlation • Alert Deduplication • Log Forwarding • On-Call Escalation</text>

    <!-- Tagline / Features Overview -->
    <text x="600" y="184" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">Enterprise SaaS Leaders &amp; Battle-Tested Open-Source GitHub Repositories for Modern NOCs &amp; SRE Teams</text>
  </g>
</svg>