<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a10"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1f2937" stop-opacity=".8"/><stop offset="100%" stop-color="#111827" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="18"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes pulseAlert{0%{fill:#ef4444;filter:drop-shadow(0 0 3px #ef4444)}50%{fill:#f97316;filter:drop-shadow(0 0 10px #f97316)}}@keyframes pulseHealthy{0%{fill:#10b981;filter:drop-shadow(0 0 3px #10b981)}50%{fill:#34d399;filter:drop-shadow(0 0 10px #34d399)}}@keyframes dashStream{0%{stroke-dashoffset:120}}@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes floatReverse{0%{transform:translateY(0)}50%{transform:translateY(7px)}}.anim-glow1{animation:pulseGlow 6s ease-in-out infinite;transform-origin:200px 100px}.anim-glow2{animation:pulseGlow 8s ease-in-out infinite reverse;transform-origin:1000px 320px}.anim-alert-dot{animation:pulseAlert 2s infinite ease-in-out}.anim-healthy-dot{animation:pulseHealthy 2.5s infinite ease-in-out}.anim-stream{stroke-dasharray:8 6;animation:dashStream 3s linear infinite}.anim-card-1{animation:floatSlow 5s ease-in-out infinite}.anim-card-2{animation:floatReverse 6s ease-in-out infinite}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><circle cx="180" cy="90" r="140" fill="#38bdf8" class="anim-glow1" filter="url(#softGlow)" opacity=".2"/><circle cx="1020" cy="310" r="160" fill="#818cf8" class="anim-glow2" filter="url(#softGlow)" opacity=".2"/><circle cx="600" cy="210" r="180" fill="#c084fc" filter="url(#softGlow)" opacity=".12"/><g opacity=".75"><path fill="none" stroke="#60a5fa" stroke-width="2.5" d="M 120 330 C 260 330, 240 270, 380 270" class="anim-stream" opacity=".6"/><path fill="none" stroke="#a855f7" stroke-width="2.5" d="M 820 270 C 940 270, 960 330, 1080 330" class="anim-stream" opacity=".6"/></g><g class="anim-card-1" transform="translate(60, 230)"><rect width="260" height="130" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" rx="12"/><circle cx="28" cy="28" r="6" class="anim-alert-dot"/><text x="44" y="33" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Event Ingest Storm</text><text x="22" y="62" fill="#9ca3af" font-family="monospace" font-size="11">Events: 24,500/sec</text><text x="22" y="84" fill="#9ca3af" font-family="monospace" font-size="11">Noise Deduplicated: 98.4%</text><rect width="130" height="16" x="22" y="100" fill="#ef4444" fill-opacity=".2" stroke="#ef4444" stroke-width=".8" rx="4"/><text x="28" y="112" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold">HIGH ALERT DEDUP</text></g><g class="anim-card-2" transform="translate(880, 230)"><rect width="260" height="130" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" rx="12"/><circle cx="28" cy="28" r="6" class="anim-healthy-dot"/><text x="44" y="33" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Correlated Root Cause</text><text x="22" y="62" fill="#9ca3af" font-family="monospace" font-size="11">Active Incidents: 1 (Was 64)</text><text x="22" y="84" fill="#9ca3af" font-family="monospace" font-size="11">Escalated: PagerDuty / NOC</text><rect width="135" height="16" x="22" y="100" fill="#10b981" fill-opacity=".2" stroke="#10b981" stroke-width=".8" rx="4"/><text x="28" y="112" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold">AIOps RCA RESOLVED</text></g><g transform="translate(600, 290)"><circle cx="0" cy="0" r="32" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#glow)"/><circle cx="0" cy="0" r="12" fill="#6366f1" class="anim-healthy-dot"/><circle cx="0" cy="0" r="42" fill="none" stroke="#4f46e5" stroke-dasharray="4 4" stroke-width="1" opacity=".6"/></g><g id="foreground-content"><g transform="translate(600, 48)"><rect width="330" height="28" x="-165" y="0" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity=".95" rx="14"/><text x="0" y="18" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">⚡ CURATED AIOPS &amp; ALERTING DIRECTORY</text></g><text x="600" y="115" fill="url(#primaryGrad)" filter="url(#glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="-.5" text-anchor="middle">Awesome IT Event Management &amp; Alerting</text><text x="600" y="152" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" letter-spacing=".2" text-anchor="middle">AIOps Event Correlation • Alert Deduplication • Log Forwarding • On-Call Escalation</text><text x="600" y="184" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" text-anchor="middle">Enterprise SaaS Leaders &amp; Battle-Tested Open-Source GitHub Repositories for Modern NOCs &amp; SRE Teams</text></g></svg>